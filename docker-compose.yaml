
volumes: 
  dms_redis_data:
  register_service_data:

networks:
  register_service:
    driver: bridge

services:
  redis:
    image: redis/redis-stack:latest
    container_name: dms-register-service-go-redis
    ports:
      - "6479:6379"
      - "4000:8001"
    volumes:
      - dms_redis_data:/data
    restart: always
    networks:
      - register_service

  db:
    image: postgres:16-alpine
    container_name: dms-register-service-go-database
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: register_service
    ports:
      - "5432:5432"
    volumes:
      - register_service_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - register_service
